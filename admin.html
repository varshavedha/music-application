<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamify Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-music"></i> Streamify
        </a>
        <nav class="nav-links">
            <a href="index.html">Back to Player</a>
        </nav>
    </header>

    <main>
        <div class="admin-container">
            <h2 class="section-title">Add New Song</h2>
            <form id="addSongForm">
                <div class="form-group">
                    <label for="title">Song Title *</label>
                    <input type="text" id="title" required placeholder="e.g., Kannana Kanne">
                </div>
                <div class="form-group">
                    <label for="artist">Artist *</label>
                    <input type="text" id="artist" required placeholder="e.g., Anirudh Ravichander">
                </div>
                <div class="form-group">
                    <label for="album">Album</label>
                    <input type="text" id="album" placeholder="e.g., Naanum Rowdy Dhaan">
                </div>
                <div class="form-group">
                    <label for="cover_url">Cover Image URL</label>
                    <input type="url" id="cover_url" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label for="audio_url">Cloudinary Audio URL *</label>
                    <input type="url" id="audio_url" required placeholder="https://res.cloudinary.com/.../Kannana-Kanne.mp3">
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Add Song</button>
            </form>

            <h2 class="section-title" style="margin-top: 50px;">Manage Songs</h2>
            <div id="loader" class="loader" style="display: none;"></div>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Cover</th>
                            <th>Title</th>
                            <th>Artist</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="songTableBody">
                        <!-- Songs will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
