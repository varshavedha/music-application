<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Stream</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-music"></i> Streamify
        </a>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for songs, artists, or albums...">
        </div>
        <nav class="nav-links">
            <a href="admin.html">Admin Panel</a>
        </nav>
    </header>

    <main>
        <h2 class="section-title">All Songs</h2>
        <div id="loader" class="loader"></div>
        <div class="song-grid" id="songGrid">
            <!-- Songs will be injected here dynamically -->
        </div>
    </main>

    <div class="player-container">
        <div class="now-playing">
            <img id="playerCover" src="https://via.placeholder.com/56" alt="Cover" style="display: none;">
            <div class="now-playing-info">
                <span class="now-playing-title" id="playerTitle">Select a song to play</span>
                <span class="now-playing-artist" id="playerArtist"></span>
            </div>
        </div>

        <div class="player-controls-container">
            <div class="player-controls">
                <button class="control-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="control-btn play-pause-btn" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
                <button class="control-btn" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar-wrapper" id="progressWrapper">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="volume-container">
            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer"></audio>

    <script type="module" src="app.js"></script>
</body>
</html>
